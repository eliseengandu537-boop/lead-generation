# Source: https://github.com/eliseengandu537-boop/lead-generation
# $0 hosting: one free web service, external free Postgres, local automation.
# The database connection is supplied privately after creating the Neon project.
services:
  - type: web
    name: orbit-lead-generation
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: node scripts/render-start.mjs web
    healthCheckPath: /api/platform/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_URL
        fromService:
          name: orbit-lead-generation
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: PLATFORM_ENCRYPTION_SEED
        generateValue: true
      - key: TENANT_DATABASE_PASSWORD
        generateValue: true
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: LIVE_EMAIL_ENABLED
        value: "false"
      - key: ORBIT_AUTOMATION_LOCATION
        value: local
